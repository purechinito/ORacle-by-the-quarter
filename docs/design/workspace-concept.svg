  <path d="M250 418v80" stroke="#17675F" stroke-width="4"/>
  <text x="270" y="448" class="medium">Review order trail</text>
  <text x="270" y="474" class="small muted">SO353 · 125 Quire inc.</text>
  <rect x="650" y="440" width="98" height="28" rx="14" fill="#D9E8DF"/>
  <text x="699" y="459" text-anchor="middle" class="small" fill="#245B46" font-weight="600">Reference</text>
  <rect x="851" y="436" width="214" height="39" rx="6" fill="#17675F"/>
  <text x="871" y="461" class="small" font-weight="600" fill="#FFFFFF">Inspect record</text><use href="#arrow" x="1035" y="450" color="#FFFFFF"/>

  <path d="M248 498h840" stroke="#DEE4DC"/>
  <text x="270" y="529" class="medium">Check supplier variance</text>
  <text x="270" y="555" class="small muted">Sample bill · 2 lines need a decision</text>
  <rect x="650" y="521" width="117" height="28" rx="14" fill="#F2E6CD"/>
  <text x="708.5" y="540" text-anchor="middle" class="small" fill="#755018" font-weight="600">Needs review</text>
  <rect x="851" y="517" width="214" height="39" rx="6" fill="#FBFCF9" stroke="#A7BFB2"/>
  <text x="871" y="542" class="small teal" font-weight="600">Review bill</text><use href="#arrow" x="1035" y="531" color="#17675F"/>

  <path d="M248 579h840" stroke="#DEE4DC"/>
  <text x="270" y="610" class="medium">Release a purchase order</text>
  <text x="270" y="636" class="small muted">Sample purchase · approval assigned to you</text>
  <rect x="650" y="602" width="117" height="28" rx="14" fill="#F2E6CD"/>
  <text x="708.5" y="621" text-anchor="middle" class="small" fill="#755018" font-weight="600">Approval due</text>
  <rect x="851" y="598" width="214" height="39" rx="6" fill="#FBFCF9" stroke="#A7BFB2"/>
  <text x="871" y="623" class="small teal" font-weight="600">Review approval</text><use href="#arrow" x="1035" y="612" color="#17675F"/>

  <path d="M248 660h840" stroke="#DEE4DC"/>
  <text x="270" y="691" class="medium">Receive an incoming delivery</text>
  <text x="270" y="717" class="small muted">Sample receipt · San Francisco</text>
  <rect x="650" y="683" width="80" height="28" rx="14" fill="#E5ECE6"/>
  <text x="690" y="702" text-anchor="middle" class="small" fill="#42564B" font-weight="600">Ready</text>
  <rect x="851" y="679" width="214" height="39" rx="6" fill="#FBFCF9" stroke="#A7BFB2"/>
  <text x="871" y="704" class="small teal" font-weight="600">Start receipt</text><use href="#arrow" x="1035" y="693" color="#17675F"/>

  <path d="M248 741h840" stroke="#DEE4DC"/>
  <text x="270" y="772" class="medium">Resolve a stock exception</text>
  <text x="270" y="798" class="small muted">Sample transfer · quantity unavailable</text>
  <rect x="650" y="764" width="85" height="28" rx="14" fill="#F3E1D9"/>
  <text x="692.5" y="783" text-anchor="middle" class="small" fill="#8B4432" font-weight="600">Blocked</text>
  <rect x="851" y="760" width="214" height="39" rx="6" fill="#FBFCF9" stroke="#A7BFB2"/>
  <text x="871" y="785" class="small teal" font-weight="600">Resolve quantity</text><use href="#arrow" x="1035" y="774" color="#17675F"/>

  <path d="M248 822h840" stroke="#DEE4DC"/>
  <text x="270" y="853" class="medium">Follow up on a draft quote</text>
  <text x="270" y="879" class="small muted">Sample quote · assigned follow-up</text>
  <rect x="650" y="845" width="75" height="28" rx="14" fill="#E6E9EB"/>
  <text x="687.5" y="864" text-anchor="middle" class="small" fill="#4A5E6A" font-weight="600">Draft</text>
  <rect x="851" y="841" width="214" height="39" rx="6" fill="#FBFCF9" stroke="#A7BFB2"/>
  <text x="871" y="866" class="small teal" font-weight="600">Open quote</text><use href="#arrow" x="1035" y="855" color="#17675F"/>

  <text x="248" y="934" class="small muted">Saved view: Priority work</text>
  <text x="1087" y="934" text-anchor="end" class="small muted">6 items · task data is illustrative</text>
  <path d="M248 954h840" stroke="#D6DED5"/>
  <text x="248" y="980" class="small muted">Priority rules to review: blockers, due dates, and role relevance.</text>

  <!-- Side context is tied to the selected record and never covers the queue. -->
  <rect x="1120" y="122" width="380" height="878" fill="#FBFCF9"/>
