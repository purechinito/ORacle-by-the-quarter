services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: quarter
      POSTGRES_USER: quarter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - quarter-db:/var/lib/postgresql/data
volumes:
  quarter-db:
