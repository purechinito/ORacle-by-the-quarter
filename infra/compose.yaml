# Adapted from frappe/frappe_docker at the commit in versions.json (MIT).
name: clone-oracle

x-engine: &engine
  image: ${ERPNEXT_IMAGE:?Run scripts/erp init first}
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  restart: unless-stopped

services:
  db:
    image: ${MARIADB_IMAGE:?Missing pinned database image}
    restart: unless-stopped
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --skip-character-set-client-handshake]
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?Missing database password}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 30

  redis-cache:
    image: ${REDIS_IMAGE:?Missing pinned queue image}
    restart: unless-stopped

  redis-queue:
    image: ${REDIS_IMAGE:?Missing pinned queue image}
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-queue-data:/data

  configurator:
    <<: *engine
    restart: "no"
    entrypoint: [bash, -ec]
    command:
      - |
        ls -1 apps > sites/apps.txt
        bench set-config -g db_host db
        bench set-config -gp db_port 3306
        bench set-config -g redis_cache redis://redis-cache:6379
        bench set-config -g redis_queue redis://redis-queue:6379
        bench set-config -g redis_socketio redis://redis-queue:6379
        bench set-config -gp socketio_port 9000

  create-site:
    <<: *engine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      configurator:
        condition: service_completed_successfully
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Missing database password}
      ERP_ADMIN_PASSWORD: ${ERP_ADMIN_PASSWORD:?Missing administrator password}
    entrypoint: [bash, -ec]
    command:
      - |
        if [ -f sites/frontend/site_config.json ]; then
          bench --site frontend list-apps | grep -q erpnext
          echo "Existing ERPNext site verified; creation skipped."
        else
          bench new-site frontend --mariadb-user-host-login-scope='%' --db-root-username=root --db-root-password="$$DB_PASSWORD" --admin-password="$$ERP_ADMIN_PASSWORD" --install-app erpnext --set-default
        fi
        if [ -d apps/quarter_erp ]; then
          if ! bench --site frontend list-apps | grep -q quarter_erp; then
            bench --site frontend install-app quarter_erp
          fi
          bench --site frontend clear-cache
        fi

  backend:
    <<: *engine
    depends_on:
      create-site:
        condition: service_completed_successfully

  frontend:
    <<: *engine
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: frontend
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    depends_on: [backend, websocket]
    ports:
      - "127.0.0.1:8080:8080"

  websocket:
    <<: *engine
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      create-site:
        condition: service_completed_successfully

  queue-long:
    <<: *engine
    command: [bench, worker, --queue, "long,default,short"]
    depends_on:
      create-site:
        condition: service_completed_successfully

  queue-short:
    <<: *engine
    command: [bench, worker, --queue, "short,default"]
    depends_on:
      create-site:
        condition: service_completed_successfully

  scheduler:
    <<: *engine
    command: [bench, schedule]
    depends_on:
      create-site:
        condition: service_completed_successfully

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:
